app:
  kuma:
    intraday-push-url: ${KUMA_PUSH_INTRADAY:}

spring:
  application:
    name: cairn-kafka
  main:
    web-application-type: none
    keep-alive: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 250
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        linger.ms: 0
    consumer:
      group-id: cairn-valuation
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: latest
  datasource:
    url: jdbc:postgresql://localhost:5432/app
    username: app
    password: app
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    # Only used by the *IT test, which migrates a throwaway Testcontainers database with the real
    # changelog before ddl-auto: validate checks it. The demo changeset (012-seed-demo) is
    # opt-in via context="demo" and must stay excluded here, exactly as in the batch and API.
    contexts: '!demo'
