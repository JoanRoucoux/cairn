app:
  zone: Europe/Paris
  kuma:
    intraday-push-url: ${KUMA_PUSH_INTRADAY:}
    summary-push-url: ${KUMA_PUSH_SUMMARY:}
  client:
    yahoo:
      base-url: https://query1.finance.yahoo.com
      connect-timeout: 3s
      read-timeout: 10s
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
      pause-between-calls: 300ms
    coingecko:
      base-url: https://api.coingecko.com
      connect-timeout: 3s
      read-timeout: 10s
    sg-sirius:
      base-url: https://investmentsolutions.societegenerale.fr
      connect-timeout: 5s
      read-timeout: 30s
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
    amundi:
      base-url: https://www.amundi-ee.com
      connect-timeout: 5s
      read-timeout: 30s
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
  telegram:
    base-url: https://api.telegram.org
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    connect-timeout: 3s
    read-timeout: 10s

spring:
  application:
    name: cairn-kafka
  docker:
    compose:
      file: ../compose.local.yaml
      lifecycle-management: start-only
      start:
        skip: never
      profiles:
        active: kafka
  main:
    web-application-type: none
    keep-alive: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.apicurio.registry.serde.avro.AvroKafkaSerializer
      properties:
        max.block.ms: 250
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        linger.ms: 0
        apicurio.registry.artifact-resolver-strategy: io.apicurio.registry.serde.avro.strategy.RecordIdStrategy
        apicurio.registry.auto-register: false
        apicurio.registry.retry-count: 0
        apicurio.registry.retry-backoff-ms: 100
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: latest
      properties:
        spring.deserializer.value.delegate.class: io.apicurio.registry.serde.avro.AvroKafkaDeserializer
        apicurio.registry.use-specific-avro-reader: true
    properties:
      apicurio.registry.url: ${APICURIO_REGISTRY_URL:http://localhost:8081/apis/registry/v3}
  datasource:
    url: jdbc:postgresql://localhost:5432/app
    username: app
    password: app
    hikari:
      maximum-pool-size: 3
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    contexts: '!demo'

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: false

logging:
  expect-correlation-id: true
  structured:
    json:
      stacktrace:
        root: first
        max-length: 8192
