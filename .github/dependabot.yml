version: 2
updates:
  # One pull request for the whole Maven tree, not one per family: every module is parented by
  # spring-boot-starter-parent separately, so a Spring bump and the plugins it manages land
  # together or leave the modules out of step. Dependabot cannot group two ecosystems together,
  # so actions keep their own.
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directories:
      - /cairn-api
      - /cairn-schema
      - /cairn-batch
    schedule:
      interval: weekly
    groups:
      images:
        patterns:
          - '*'

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A major PostgreSQL release cannot read the previous one's data directory: that upgrade is
      # a dump and restore, never a tag bump.
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
    groups:
      images:
        patterns:
          - '*'
