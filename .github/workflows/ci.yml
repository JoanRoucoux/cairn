name: CI

on:
  pull_request:
  # deploy.yml calls this workflow on every push to main, which is why push is not listed.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Check formatting
        run: ./mvnw -ntp -B spotless:check

      # Unit tests, ArchUnit rules, integration tests (Testcontainers), coverage check.
      - name: Verify
        run: ./mvnw -ntp -B verify

  # A broken Dockerfile would otherwise surface only during a deploy.
  docker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [api, schema, batch]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the ${{ matrix.module }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: cairn-${{ matrix.module }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.module }}

  ops:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the deploy scripts
        run: shellcheck deploy/*.sh

      - name: Check the workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
