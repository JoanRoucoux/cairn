openapi: 3.0.3
info:
  title: Cairn API
  description: >-
    Contract-first API of Cairn, a single-owner wealth tracker. It values a portfolio of accounts
    (envelopes such as a PEA or a savings account) and their holdings of instruments, priced from
    Yahoo Finance, CoinGecko, Societe Generale Sirius, or entered manually. Reading conventions:
    every amount is expressed in EUR; monetary amounts are rounded to 2 decimals on the wire;
    ratios are fractions, so 0.0082 means 0.82%; `share` values are fractions of a total and sum
    to 1 across a breakdown; a value that cannot be computed is absent from the response rather
    than sent as 0; dates are ISO-8601 (`2026-09-25`) and instants are UTC ISO-8601 timestamps.
  version: 0.1.0
tags:
  - name: Portfolio
    description: The aggregated, valued portfolio
  - name: Performance
    description: The portfolio's value and change over a range, in total and per envelope
  - name: Holding
    description: Manage the holdings that make up the portfolio
  - name: Account
    description: Manage the accounts holdings live in
  - name: Instrument
    description: Manage instruments and resolve them from an ISIN
  - name: Quote
    description: Read and record quote history, and refresh quotes on demand
  - name: Jobs
    description: Inspect recent batch job runs
  - name: History
    description: The portfolio's value over time, from daily snapshots or intraday valuations
  - name: Session
    description: The signed-in owner and their registered passkeys
security:
  - sessionCookie: []
paths:
  /portfolio:
    get:
      tags: [Portfolio]
      operationId: getPortfolio
      summary: Get the valued portfolio
      description: >-
        Aggregates every holding into a single valued portfolio, with a breakdown by asset class
        and by account.
      responses:
        '200':
          description: The valued portfolio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: A holding is priced in a currency other than EUR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /portfolio/export:
    get:
      tags: [Portfolio]
      operationId: exportPortfolio
      summary: Export the portfolio as a CSV file, as of today
      description: >-
        Every valued holding, one per row. Holdings with no quote yet are left out of the file.
      responses:
        '200':
          description: Every holding, valued, as an RFC 4180 CSV file
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="cairn-2026-09-25.csv"
          content:
            text/csv:
              schema:
                type: string
              example: |
                account;instrument;isin;quantity;averageCost;price;marketValueEur;unrealizedGainEur;priceAsOf
                Sample Broker;Sample S&P 500 ETF;FR0011550185;12;26.65;28.10;337.20;17.40;2026-09-25
                Sample Broker;Sample Bank Share;GLE.PA;10;;33.50;335.00;;2026-09-25
        '401':
          $ref: '#/components/responses/Unauthorized'
  /portfolio/import:
    post:
      tags: [Portfolio]
      operationId: importPortfolio
      summary: Load a portfolio from a CSV file, creating the accounts and instruments it refers to
      description: >-
        Reads the CSV body row by row, matching each instrument to an existing one by ISIN or
        source reference before resolving it against a price source. Either every row is accepted
        and written, or nothing is written at all: a rejected file lists every offending row so it
        can be fixed in one pass.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
            example: |
              account;accountType;institution;instrument;isinOrTicker;quantity;averageCost
              Sample Broker;PEA;Sample Bank;Sample S&P 500 ETF;FR0011550185;12;26.65
              Sample Broker;CTO;Sample Bank;Sample Bank Share;GLE.PA;10;
      responses:
        '200':
          description: What the import created and updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportReportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Nothing was written; every refused row is listed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ImportRejectionResponse'
  /portfolio/performance:
    get:
      tags: [Performance]
      operationId: getPortfolioPerformance
      summary: Get the portfolio's current value and its change over a range, in total and per envelope
      description: >-
        Change is measured day over day for the shorter ranges, and reconstructed at constant
        composition for `5y` and `max` (see `PerformanceResponse.reconstructed`).
      parameters:
        - name: range
          in: query
          required: true
          description: >-
            The window the change is computed over. `5y` and `max` are reconstructed at constant
            composition rather than measured day over day (see `reconstructed`).
          schema:
            type: string
            enum: [1d, 7d, 1m, 1y, 5y, max]
          example: 1m
      responses:
        '200':
          description: The portfolio's value and change, in total and per envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceResponse'
        '400':
          description: Unknown range
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: A holding is priced in a currency other than EUR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /portfolio/import/template:
    get:
      tags: [Portfolio]
      operationId: getImportTemplate
      summary: Download the CSV template the import expects
      description: >-
        The header row plus two commented, non-imported example rows, ready to fill in.
      responses:
        '200':
          description: The header row and two commented example rows, which an import skips
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="cairn-import-template.csv"
          content:
            text/csv:
              schema:
                type: string
              example: |
                account;accountType;institution;instrument;isinOrTicker;quantity;averageCost
                # Sample Broker;PEA;Sample Bank;Sample S&P 500 ETF;FR0011550185;12;26.65
                # Sample Broker;CTO;Sample Bank;Sample Bank Share;GLE.PA;10;
        '401':
          $ref: '#/components/responses/Unauthorized'
  /holdings:
    get:
      tags: [Holding]
      operationId: listHoldings
      summary: List every holding
      description: >-
        Every holding, valued. A holding whose account, instrument or quote cannot be joined is
        left out rather than returned incomplete.
      responses:
        '200':
          description: Every holding
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HoldingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Holding]
      operationId: createHolding
      summary: Create a holding
      description: An account can only hold one position per instrument; use the update endpoint to change its quantity.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHoldingRequest'
            example:
              accountId: 8f14e45f-ceea-467e-adc4-0a2c1fe23c5f
              instrumentId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              quantity: 12
              averageCost: 26.65
      responses:
        '201':
          description: Holding created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Unknown account or instrument
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: The account already holds this instrument, or the quantity is zero
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /holdings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The holding's id.
        schema:
          type: string
          format: uuid
    patch:
      tags: [Holding]
      operationId: updateHolding
      summary: Update a holding
      description: Replaces the holding's quantity and cost basis. The account and instrument cannot be changed.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHoldingRequest'
            example:
              quantity: 31
              averageCost: 27.10
      responses:
        '200':
          description: Holding updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Unknown holding
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: The quantity is zero
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      tags: [Holding]
      operationId: deleteHolding
      summary: Delete a holding
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204':
          description: Holding deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Unknown holding
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /accounts:
    get:
      tags: [Account]
      operationId: listAccounts
      summary: List every account
      responses:
        '200':
          description: Every account
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Account]
      operationId: createAccount
      summary: Create an account
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
            example:
              name: Sample Broker PEA
              type: PEA
              institution: Sample Bank
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: An account with this name already exists (account names are unique)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /accounts/{id}/cash:
    parameters:
      - name: id
        in: path
        required: true
        description: The account's id.
        schema:
          type: string
          format: uuid
    put:
      tags: [Account]
      operationId: setCashBalance
      summary: Set an account's cash balance in one call
      description: >-
        Creates, updates or removes the account's single EUR cash holding so its balance matches
        the given amount: a positive amount upserts the cash holding, and a zero amount deletes it
        if one exists. There is at most one EUR cash holding per account.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCashBalanceRequest'
            example:
              amount: 1500.00
      responses:
        '204':
          description: Cash balance set
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Unknown account
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: A negative amount
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /instruments:
    get:
      tags: [Instrument]
      operationId: listInstruments
      summary: List every instrument
      responses:
        '200':
          description: Every instrument
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstrumentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Instrument]
      operationId: createInstrument
      summary: Create an instrument
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstrumentRequest'
            example:
              name: Sample S&P 500 ETF
              isin: FR0011550185
              currency: EUR
              assetClass: ETF
              priceSource: YAHOO
              sourceRef: SXR8.DE
      responses:
        '201':
          description: Instrument created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Another instrument already uses this ISIN or source reference
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: >-
            Invalid instrument: `sourceRef` is required unless `priceSource` is `MANUAL`, or
            `description` is over 280 characters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /instruments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The instrument's id.
        schema:
          type: string
          format: uuid
    get:
      tags: [Instrument]
      operationId: getInstrument
      summary: Get an instrument's detail
      responses:
        '200':
          description: Instrument detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown instrument
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    put:
      tags: [Instrument]
      operationId: updateInstrument
      summary: Replace an instrument's editable fields
      description: The currency is not editable; it is kept from the existing instrument.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInstrumentRequest'
            example:
              name: Sample S&P 500 ETF
              assetClass: ETF
              priceSource: YAHOO
              isin: FR0011550185
              sourceRef: SXR8.DE
      responses:
        '200':
          description: Instrument updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Unknown instrument
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Another instrument already uses this ISIN or source reference
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: >-
            Invalid instrument: `sourceRef` is required unless `priceSource` is `MANUAL`, or
            `description` is over 280 characters. Attempting to change the currency is silently
            ignored rather than rejected.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      tags: [Instrument]
      operationId: deleteInstrument
      summary: Delete an instrument and its holdings
      description: Deletes the instrument and every holding of it, in one transaction.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204':
          description: Instrument deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Unknown instrument
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /instruments/resolve:
    post:
      tags: [Instrument]
      operationId: resolveInstrument
      summary: Resolve a query into candidate price sources
      description: >-
        Probes every price source that could know the query for a live price. A source that is
        down is skipped rather than failing the whole call.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: An ISIN, a ticker or a name
                  example: FR0011550185
      responses:
        '200':
          description: Candidate price sources, each probed for a live price
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstrumentCandidateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: No source knows this instrument
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /instruments/{id}/quotes:
    parameters:
      - name: id
        in: path
        required: true
        description: The instrument's id.
        schema:
          type: string
          format: uuid
    get:
      tags: [Quote]
      operationId: listQuotes
      summary: List an instrument's quote history over a date range
      description: An unknown instrument yields an empty list, not a 404.
      parameters:
        - name: from
          in: query
          required: true
          description: Start of the range, inclusive.
          schema:
            type: string
            format: date
          example: 2026-01-01
        - name: to
          in: query
          required: true
          description: End of the range, inclusive.
          schema:
            type: string
            format: date
          example: 2026-09-25
      responses:
        '200':
          description: The quote history over the requested range
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Quote]
      operationId: recordQuote
      summary: Record a manual quote for an instrument
      description: Records a MANUAL quote, replacing any quote already recorded for that instrument on that date.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordQuoteRequest'
            example:
              asOf: 2026-09-25
              price: 28.10
      responses:
        '201':
          description: Quote recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Unknown instrument
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /quotes/refresh:
    post:
      tags: [Quote]
      operationId: refreshQuotes
      summary: Refresh every refreshable instrument's quote synchronously
      description: >-
        Fetches a fresh quote for every non-manual instrument. A per-instrument failure (an
        upstream source down, or a query it no longer resolves) is reported in `failures`; it
        never fails the call as a whole.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200':
          description: The outcome of the refresh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshReportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /jobs/runs:
    get:
      tags: [Jobs]
      operationId: getJobRuns
      summary: List recent batch job runs, most recent first
      parameters:
        - name: limit
          in: query
          required: false
          description: The maximum number of runs to return.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Recent batch job executions, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobRunResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /history:
    get:
      tags: [History]
      operationId: getHistory
      summary: Get the portfolio value over time
      description: >-
        In `snapshot` mode, returns the measured value recorded by the nightly snapshot job for
        each day in range. In `constant-mix` mode, reprices today's holdings over past quotes, so
        the composition is held constant while the market moves; this is how `5y` and `max`
        performance is reconstructed.
      parameters:
        - name: mode
          in: query
          required: true
          description: >-
            `snapshot` returns the measured nightly value; `constant-mix` reprices today's holdings
            over the requested range.
          schema:
            type: string
            enum: [snapshot, constant-mix]
          example: snapshot
        - name: from
          in: query
          required: true
          description: Start of the range, inclusive.
          schema:
            type: string
            format: date
          example: 2026-01-01
        - name: to
          in: query
          required: true
          description: End of the range, inclusive. Must not be before `from`.
          schema:
            type: string
            format: date
          example: 2026-09-25
      responses:
        '200':
          description: The portfolio value over time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
        '400':
          description: Unknown mode, or `to` is before `from`
        '401':
          $ref: '#/components/responses/Unauthorized'
  /history/intraday:
    get:
      tags: [History]
      operationId: getIntradayHistory
      summary: Get the requested day's valuation points
      description: >-
        The worker's 15-minute valuations of that Europe/Paris day, as recorded by its intraday
        refresh scheduler.
      parameters:
        - name: date
          in: query
          required: true
          description: The Europe/Paris day to return valuation points for.
          schema:
            type: string
            format: date
          example: 2026-09-25
      responses:
        '200':
          description: The requested day's valuation points
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntradayHistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /session:
    get:
      tags: [Session]
      operationId: getSession
      summary: Get the signed-in owner and their registered passkeys
      responses:
        '200':
          description: The signed-in owner and the passkeys registered for them
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /session/passkeys/{credentialId}:
    delete:
      tags: [Session]
      operationId: revokePasskey
      summary: Revoke a passkey
      description: >-
        Also signs out every other session of the owner, since a revoked passkey may have been the
        one used to open them.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: credentialId
          in: path
          required: true
          description: Base64url credential id, as returned by `GET /session`.
          schema:
            type: string
      responses:
        '204':
          description: The passkey no longer opens this account
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such passkey for this owner
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: This is the last passkey; revoking it would lock the owner out
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: >-
        Session opened by a passkey (WebAuthn) sign-in, lasting 30 days, sliding. The ceremony
        itself is served by Spring Security, not by this contract: `POST /webauthn/register/options`
        then `POST /webauthn/register` for registration, `POST /webauthn/authenticate/options`
        then `POST /login/webauthn` for sign-in, and `POST /logout` to end the session.
    csrfToken:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: >-
        Required on every POST, PUT, PATCH and DELETE. The value is the raw token from the
        `XSRF-TOKEN` cookie the server sets; a write submitted without it is refused with 403.
  responses:
    Unauthorized:
      description: No valid session
    Forbidden:
      description: Missing or wrong CSRF token on a write
    BadRequest:
      description: >-
        The body could not be read, a required field is missing, or a parameter has the wrong
        type. Rendered in Spring Boot's default error format, not as a problem detail.
    NotFound:
      description: The resource does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: The resource conflicts with one that already exists
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    BusinessRuleViolated:
      description: A business rule was violated
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    ProblemDetail:
      description: >-
        RFC 9457 problem detail, served as `application/problem+json` for every business, conflict
        and not-found error.
      type: object
      properties:
        type:
          type: string
          description: A URI reference identifying the problem type. `about:blank` when none is more specific.
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          description: The HTTP status code, repeated from the response.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          description: A URI reference identifying this specific occurrence of the problem.
    AccountType:
      type: string
      description: >-
        The kind of envelope an account is. `PEA`/`PEA_PME` and `PER` are French tax-advantaged
        equity and retirement accounts, `CTO` is an ordinary brokerage account, `PEE` is an
        employee savings plan, `LIFE_INSURANCE` is a French assurance-vie, `SAVINGS` is a bank
        savings account, and `CRYPTO` is a crypto exchange or wallet.
      enum: [PEA, PEA_PME, CTO, PER, PEE, LIFE_INSURANCE, SAVINGS, CRYPTO]
    AssetClass:
      type: string
      description: >-
        The kind of instrument. `EQUITY` is a single stock, `ETF` an exchange-traded fund, `FUND`
        a non-traded fund, `CRYPTO` a cryptocurrency, and `CASH` a currency balance priced at par.
      enum: [EQUITY, ETF, FUND, CRYPTO, CASH]
    PriceSource:
      type: string
      description: >-
        Where an instrument's price comes from. `YAHOO` is Yahoo Finance, `COINGECKO` is CoinGecko,
        `SG_SIRIUS` is Societe Generale's structured-product pricing feed, and `MANUAL` means the
        price is entered by hand rather than fetched.
      enum: [YAHOO, COINGECKO, SG_SIRIUS, MANUAL]
    PerformanceRange:
      type: string
      description: >-
        The window a performance figure is computed over. `5y` and `max` are reconstructed at
        constant composition rather than measured day over day (see `reconstructed`).
      enum: [1d, 7d, 1m, 1y, 5y, max]
    PortfolioResponse:
      type: object
      required:
        [totalEur, dayChangeEur, staleCount, unvaluedCount, generatedAt, byAssetClass, byAccount, holdings]
      properties:
        totalEur:
          type: number
          description: The portfolio's total value, across every valued holding.
          example: 184320.75
        dayChangeEur:
          type: number
          description: The portfolio's value change since the previous close.
        dayChangeRatio:
          type: number
          nullable: true
          description: Absent when the previous total is zero.
        unrealizedGainEur:
          type: number
          nullable: true
          description: Absent when no holding's cost basis is known enough to sum. Never 0.
        unrealizedGainRatio:
          type: number
          nullable: true
          description: Absent when the cost basis total is zero.
        staleCount:
          type: integer
          description: The number of holdings whose latest quote is older than expected for their asset class.
        unvaluedCount:
          type: integer
          description: >-
            The number of holdings with no quote yet. Excluded from totalEur, the allocations and
            the unrealized gain until a quote is fetched.
        generatedAt:
          type: string
          format: date-time
          description: When this response was computed.
        byAssetClass:
          type: array
          description: Sorted by valueEur, descending.
          items:
            $ref: '#/components/schemas/AllocationResponse'
        byAccount:
          type: array
          description: Sorted by valueEur, descending.
          items:
            $ref: '#/components/schemas/AllocationResponse'
        holdings:
          type: array
          items:
            $ref: '#/components/schemas/HoldingResponse'
    PerformanceResponse:
      type: object
      required: [range, from, to, reconstructed, total, byEnvelope]
      properties:
        range:
          $ref: '#/components/schemas/PerformanceRange'
        from:
          type: string
          format: date
          description: Start of the range, inclusive.
        to:
          type: string
          format: date
          description: End of the range, inclusive.
        reconstructed:
          type: boolean
          description: >
            True when the change is rebuilt at constant composition (5y and max) rather than
            measured day over day.
        lastPriceAt:
          type: string
          format: date-time
          nullable: true
          description: >
            The most recent fetchedAt among the quotes of the valued lines, excluding manual cash
            at par. Absent when nothing is quoted yet.
        total:
          $ref: '#/components/schemas/PerformanceTotalResponse'
        byEnvelope:
          type: array
          description: Sorted by valueEur, descending.
          items:
            $ref: '#/components/schemas/EnvelopePerformanceResponse'
    PerformanceTotalResponse:
      type: object
      required: [valueEur, changeEur]
      properties:
        valueEur:
          type: number
          description: The portfolio's total value at the end of the range.
        changeEur:
          type: number
          description: The portfolio's value change over the range.
        changeRatio:
          type: number
          nullable: true
          description: Absent when the base value is zero.
    EnvelopePerformanceResponse:
      type: object
      required: [accountType, valueEur, share, changeEur]
      properties:
        accountType:
          $ref: '#/components/schemas/AccountType'
        valueEur:
          type: number
          description: The total value of every account of this type, at the end of the range.
        share:
          type: number
          description: This envelope's fraction of the portfolio's total value.
        changeEur:
          type: number
          description: This envelope's value change over the range.
        changeRatio:
          type: number
          nullable: true
          description: Absent when the base value is zero.
    ImportRejectionResponse:
      description: >-
        RFC 9457 problem detail for a refused import. Nothing was written: every row that could
        not be accepted is listed, so the whole file can be fixed in one pass.
      type: object
      required: [status, detail, errors]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ImportErrorResponse'
    ImportErrorResponse:
      description: >-
        One refused row. The server states what went wrong as a code, never as a sentence, so the
        wording belongs to whoever displays it and can be translated.
      type: object
      required: [line, code]
      properties:
        line:
          type: integer
          description: 1-based line in the submitted file; 1 when the header itself is wrong
        code:
          type: string
          enum:
            - BAD_HEADER
            - WRONG_COLUMN_COUNT
            - UNKNOWN_ACCOUNT_TYPE
            - NOT_A_NUMBER
            - ZERO_QUANTITY
            - UNRESOLVED_INSTRUMENT
        value:
          type: string
          description: The offending token, absent when the failure has none
    ImportReportResponse:
      type: object
      required: [accountsCreated, instrumentsCreated, holdingsCreated, holdingsUpdated]
      properties:
        accountsCreated:
          type: integer
        instrumentsCreated:
          type: integer
        holdingsCreated:
          type: integer
        holdingsUpdated:
          type: integer
    AllocationResponse:
      type: object
      required: [label, valueEur, share]
      properties:
        label:
          type: string
          description: The asset class or account name this allocation groups holdings under.
        valueEur:
          type: number
        share:
          type: number
          description: This allocation's fraction of the portfolio's total value.
    CreateHoldingRequest:
      type: object
      required: [accountId, instrumentId, quantity]
      properties:
        accountId:
          type: string
          format: uuid
        instrumentId:
          type: string
          format: uuid
        quantity:
          type: number
          description: Must not be zero.
        averageCost:
          type: number
          nullable: true
          description: The per-unit cost basis. Omit when unknown.
    UpdateHoldingRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: number
          description: Must not be zero.
        averageCost:
          type: number
          nullable: true
          description: The per-unit cost basis. Omit when unknown.
    HoldingResponse:
      type: object
      required:
        - id
        - accountId
        - accountName
        - accountType
        - instrumentId
        - instrumentName
        - assetClass
        - quantity
        - priceSource
        - stale
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        accountName:
          type: string
        accountType:
          $ref: '#/components/schemas/AccountType'
        instrumentId:
          type: string
          format: uuid
        instrumentName:
          type: string
        isin:
          type: string
          nullable: true
        assetClass:
          $ref: '#/components/schemas/AssetClass'
        quantity:
          type: number
        averageCost:
          type: number
          nullable: true
          description: Absent when the cost basis is unknown. Never 0.
        price:
          type: number
          nullable: true
          description: Absent when the instrument has no quote yet. Never 0.
        priceCurrency:
          type: string
          nullable: true
        priceAsOf:
          type: string
          format: date
          nullable: true
        priceSource:
          $ref: '#/components/schemas/PriceSource'
        stale:
          type: boolean
          description: True when the latest quote is older than expected for the instrument's asset class.
        marketValueEur:
          type: number
          nullable: true
          description: Absent when the instrument has no quote yet. Never 0.
        unrealizedGainEur:
          type: number
          nullable: true
        unrealizedGainRatio:
          type: number
          nullable: true
        dayChangeEur:
          type: number
          nullable: true
        dayChangeRatio:
          type: number
          nullable: true
    AccountResponse:
      type: object
      required: [id, name, type, institution]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Unique across every account.
        type:
          $ref: '#/components/schemas/AccountType'
        institution:
          type: string
    CreateAccountRequest:
      type: object
      required: [name, type, institution]
      properties:
        name:
          type: string
          description: Must be unique across every account.
        type:
          $ref: '#/components/schemas/AccountType'
        institution:
          type: string
    SetCashBalanceRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          description: The desired EUR cash balance. Must not be negative; zero removes the cash holding.
    InstrumentResponse:
      type: object
      required: [id, name, currency, assetClass, priceSource]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        isin:
          type: string
          nullable: true
        currency:
          type: string
          description: The instrument's native pricing currency, as an ISO 4217 code.
        assetClass:
          $ref: '#/components/schemas/AssetClass'
        priceSource:
          $ref: '#/components/schemas/PriceSource'
        sourceRef:
          type: string
          nullable: true
          description: The ticker, contract identifier or ISIN the price source is queried with. Absent for MANUAL.
    InstrumentDetailResponse:
      type: object
      required: [id, name, currency, assetClass, priceSource, holdingCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        isin:
          type: string
          nullable: true
        currency:
          type: string
          description: The instrument's native pricing currency, as an ISO 4217 code. Not editable.
        assetClass:
          $ref: '#/components/schemas/AssetClass'
        priceSource:
          $ref: '#/components/schemas/PriceSource'
        sourceRef:
          type: string
          nullable: true
          description: The ticker, contract identifier or ISIN the price source is queried with. Absent for MANUAL.
        description:
          type: string
          nullable: true
          description: Free text, up to 280 characters.
        externalUrl:
          type: string
          nullable: true
          description: Absent for a manually priced instrument. Never a broken link.
        holdingCount:
          type: integer
          description: The number of holdings that will be deleted with the instrument.
    CreateInstrumentRequest:
      type: object
      required: [name, currency, assetClass, priceSource]
      properties:
        name:
          type: string
        isin:
          type: string
          nullable: true
        currency:
          type: string
          description: The instrument's native pricing currency, as an ISO 4217 code.
        assetClass:
          $ref: '#/components/schemas/AssetClass'
        priceSource:
          $ref: '#/components/schemas/PriceSource'
        sourceRef:
          type: string
          nullable: true
          description: Required unless priceSource is MANUAL.
        description:
          type: string
          nullable: true
          description: Free text, up to 280 characters.
    UpdateInstrumentRequest:
      type: object
      required: [name, assetClass, priceSource]
      properties:
        name:
          type: string
        assetClass:
          $ref: '#/components/schemas/AssetClass'
        priceSource:
          $ref: '#/components/schemas/PriceSource'
        isin:
          type: string
          nullable: true
        sourceRef:
          type: string
          nullable: true
          description: Required unless priceSource is MANUAL.
        description:
          type: string
          nullable: true
          description: Free text, up to 280 characters.
    InstrumentCandidateResponse:
      type: object
      required: [name, source, sourceRef, assetClass, probePrice]
      properties:
        name:
          type: string
        source:
          $ref: '#/components/schemas/PriceSource'
        sourceRef:
          type: string
          description: The ticker, contract identifier or ISIN this candidate would be resolved with.
        assetClass:
          $ref: '#/components/schemas/AssetClass'
        probePrice:
          type: number
          description: The live price fetched from this source while resolving, as a sanity check.
    QuoteResponse:
      type: object
      required: [instrumentId, asOf, price, currency, source]
      properties:
        instrumentId:
          type: string
          format: uuid
        asOf:
          type: string
          format: date
        price:
          type: number
        currency:
          type: string
        source:
          $ref: '#/components/schemas/PriceSource'
    RecordQuoteRequest:
      type: object
      required: [asOf, price]
      properties:
        asOf:
          type: string
          format: date
          description: The date this price was observed on. Replaces any quote already recorded for that date.
        price:
          type: number
    RefreshReportResponse:
      type: object
      required: [refreshed, skipped, failures]
      properties:
        refreshed:
          type: integer
          description: The number of instruments successfully repriced.
        skipped:
          type: integer
          description: The number of MANUAL instruments, not attempted.
        failures:
          type: array
          description: One entry per instrument whose price source could not be reached or resolved.
          items:
            $ref: '#/components/schemas/RefreshFailureResponse'
    RefreshFailureResponse:
      type: object
      required: [instrumentId, instrumentName, source, message]
      properties:
        instrumentId:
          type: string
          format: uuid
        instrumentName:
          type: string
        source:
          $ref: '#/components/schemas/PriceSource'
        message:
          type: string
          description: A short, technical explanation of why this instrument could not be refreshed.
    JobRunResponse:
      type: object
      required: [id, jobName, status, startedAt]
      properties:
        id:
          type: integer
          format: int64
        jobName:
          type: string
          example: refreshQuotesJob
        status:
          type: string
          description: >-
            The Spring Batch execution status. `STARTED`/`STARTING`/`STOPPING` are in progress,
            `COMPLETED` is a success, `FAILED` and `ABANDONED` mark a run that did not complete,
            `STOPPED` was stopped on request, and `UNKNOWN` is a status Spring Batch could not
            determine.
          enum: [STARTING, STARTED, STOPPING, STOPPED, FAILED, COMPLETED, ABANDONED, UNKNOWN]
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
          description: Absent while the run is still in progress.
    HistoryResponse:
      type: object
      required: [mode, reconstructed, points]
      properties:
        mode:
          type: string
          description: >-
            `snapshot` returns the measured nightly value for each day; `constant-mix` reprices
            today's holdings over past quotes, holding the composition constant.
          enum: [snapshot, constant-mix]
        reconstructed:
          type: boolean
          description: >
            True when the series is rebuilt at today's composition rather than measured.
            The client warns the user when the requested range makes this material.
        points:
          type: array
          items:
            $ref: '#/components/schemas/HistoryPoint'
    HistoryPoint:
      type: object
      required: [date, totalEur]
      properties:
        date:
          type: string
          format: date
        totalEur:
          type: number
    IntradayHistoryResponse:
      type: object
      required: [points]
      properties:
        points:
          type: array
          items:
            $ref: '#/components/schemas/IntradayHistoryPoint'
    IntradayHistoryPoint:
      type: object
      required: [at, totalEur]
      properties:
        at:
          type: string
          format: date-time
          description: The instant this valuation was recorded, one of the worker's 15-minute refreshes.
        totalEur:
          type: number
    SessionResponse:
      type: object
      required: [displayName, initials, passkeys]
      properties:
        displayName:
          type: string
          example: Joan Roucoux
        initials:
          type: string
          maxLength: 2
          example: JR
        passkeys:
          type: array
          items:
            $ref: '#/components/schemas/PasskeyResponse'
    PasskeyResponse:
      type: object
      required: [credentialId, label, createdAt]
      properties:
        credentialId:
          type: string
          description: Base64url, as stored by Spring Security
        label:
          type: string
          example: iPhone de Joan
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
