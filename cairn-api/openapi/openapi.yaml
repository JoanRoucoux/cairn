openapi: 3.0.3
info:
  title: Cairn API
  description: Contract-first API of the Cairn wealth-tracking application.
  version: 0.1.0
tags:
  - name: Portfolio
    description: The aggregated, valued portfolio
  - name: Holding
    description: Manage the holdings that make up the portfolio
paths:
  /portfolio:
    get:
      tags: [Portfolio]
      operationId: getPortfolio
      summary: Get the valued portfolio
      responses:
        '200':
          description: The valued portfolio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioResponse'
        '401':
          description: No session
  /holdings:
    get:
      tags: [Holding]
      operationId: listHoldings
      summary: List every holding
      responses:
        '200':
          description: Every holding
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HoldingResponse'
    post:
      tags: [Holding]
      operationId: createHolding
      summary: Create a holding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHoldingRequest'
      responses:
        '201':
          description: Holding created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingResponse'
        '422':
          description: Unknown account or instrument, or duplicate holding
  /holdings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Holding]
      operationId: updateHolding
      summary: Update a holding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHoldingRequest'
      responses:
        '200':
          description: Holding updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingResponse'
        '404':
          description: Unknown holding
    delete:
      tags: [Holding]
      operationId: deleteHolding
      summary: Delete a holding
      responses:
        '204':
          description: Holding deleted
        '404':
          description: Unknown holding
components:
  schemas:
    PortfolioResponse:
      type: object
      required: [totalEur, dayChangeEur, staleCount, generatedAt, byAssetClass, byAccount, holdings]
      properties:
        totalEur:
          type: number
          example: 278146.45
        dayChangeEur:
          type: number
        dayChangeRatio:
          type: number
          nullable: true
        unrealizedGainEur:
          type: number
          nullable: true
          description: Absent when no holding's cost basis is known enough to sum. Never 0.
        unrealizedGainRatio:
          type: number
          nullable: true
        staleCount:
          type: integer
        generatedAt:
          type: string
          format: date-time
        byAssetClass:
          type: array
          items:
            $ref: '#/components/schemas/AllocationResponse'
        byAccount:
          type: array
          items:
            $ref: '#/components/schemas/AllocationResponse'
        holdings:
          type: array
          items:
            $ref: '#/components/schemas/HoldingResponse'
    AllocationResponse:
      type: object
      required: [label, valueEur, share]
      properties:
        label:
          type: string
        valueEur:
          type: number
        share:
          type: number
    CreateHoldingRequest:
      type: object
      required: [accountId, instrumentId, quantity]
      properties:
        accountId:
          type: string
          format: uuid
        instrumentId:
          type: string
          format: uuid
        quantity:
          type: number
        averageCost:
          type: number
          nullable: true
    UpdateHoldingRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: number
        averageCost:
          type: number
          nullable: true
    HoldingResponse:
      type: object
      required:
        - id
        - accountId
        - accountName
        - accountType
        - instrumentId
        - instrumentName
        - assetClass
        - quantity
        - price
        - priceCurrency
        - priceAsOf
        - priceSource
        - stale
        - marketValueEur
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        accountName:
          type: string
        accountType:
          type: string
          enum: [PEA, PEA_PME, CTO, PER, PEE, LIFE_INSURANCE, SAVINGS, CRYPTO]
        instrumentId:
          type: string
          format: uuid
        instrumentName:
          type: string
        isin:
          type: string
          nullable: true
        assetClass:
          type: string
          enum: [EQUITY, ETF, FUND, CRYPTO, CASH]
        quantity:
          type: number
        averageCost:
          type: number
          nullable: true
          description: Absent when the cost basis is unknown. Never 0.
        price:
          type: number
        priceCurrency:
          type: string
        priceAsOf:
          type: string
          format: date
        priceSource:
          type: string
          enum: [YAHOO, COINGECKO, SG_SIRIUS, MANUAL]
        stale:
          type: boolean
        marketValueEur:
          type: number
        unrealizedGainEur:
          type: number
          nullable: true
        unrealizedGainRatio:
          type: number
          nullable: true
        dayChangeEur:
          type: number
          nullable: true
        dayChangeRatio:
          type: number
          nullable: true
