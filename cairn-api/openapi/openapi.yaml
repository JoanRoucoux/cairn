openapi: 3.0.3
info:
  title: Cairn API
  description: >-
    Contract-first API of Cairn, a single-owner wealth tracker. It values a portfolio of accounts
    (envelopes such as a PEA or a savings account) and their holdings of instruments, priced from
    Yahoo Finance, CoinGecko, Societe Generale Sirius, or entered manually. Reading conventions:
    every amount is expressed in EUR; monetary amounts are rounded to 2 decimals on the wire;
    ratios are fractions, so 0.0082 means 0.82%; `share` values are fractions of a total and sum
    to 1 across a breakdown; a value that cannot be computed is absent from the response rather
    than sent as 0; dates are ISO-8601 (`2026-09-25`) and instants are UTC ISO-8601 timestamps.
  version: 0.1.0
tags:
  - name: Portfolio
    description: The aggregated, valued portfolio
  - name: Performance
    description: The portfolio's value and change over a range, in total and per envelope
  - name: Holding
    description: Manage the holdings that make up the portfolio
  - name: Account
    description: Manage the accounts holdings live in
  - name: Instrument
    description: Manage instruments and resolve them from an ISIN
  - name: Quote
    description: Read and record quote history, and refresh quotes on demand
  - name: Jobs
    description: Inspect recent batch job runs
  - name: History
    description: The portfolio's value over time, from daily snapshots or intraday valuations
  - name: Session
    description: The signed-in owner and their registered passkeys
security:
  - sessionCookie: []
paths:
  /portfolio:
    get:
      tags: [Portfolio]
      operationId: getPortfolio
      summary: Get the valued portfolio
      description: >-
        Aggregates every holding into a single valued portfolio, with a breakdown by asset class
        and by account.
      responses:
        '200':
          description: The valued portfolio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: A holding is priced in a currency other than EUR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /portfolio/export:
    get:
      tags: [Portfolio]
      operationId: exportPortfolio
      summary: Export the portfolio as a CSV file, as of today
      description: >-
        Every valued holding, one per row. Holdings with no quote yet are left out of the file.
      responses:
        '200':
          description: Every holding, valued, as an RFC 4180 CSV file
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="cairn-2026-09-25.csv"
          content:
            text/csv:
              schema:
                type: string
              example: |
                account;instrument;isin;quantity;averageCost;price;marketValueEur;unrealizedGainEur;priceAsOf
                Sample Broker;Sample S&P 500 ETF;FR0011550185;12;26.65;28.10;337.20;17.40;2026-09-25
                Sample Broker;Sample Bank Share;GLE.PA;10;;33.50;335.00;;2026-09-25
        '401':
          $ref: '#/components/responses/Unauthorized'
  /portfolio/import:
    post:
      tags: [Portfolio]
      operationId: importPortfolio
      summary: Load a portfolio from a CSV file, creating the accounts and instruments it refers to
      description: >-
        Reads the CSV body row by row, matching each instrument to an existing one by ISIN or
        source reference before resolving it against a price source. Either every row is accepted
        and written, or nothing is written at all: a rejected file lists every offending row so it
        can be fixed in one pass.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
            example: |
              account;accountType;institution;instrument;isinOrTicker;quantity;averageCost
              Sample Broker;PEA;Sample Bank;Sample S&P 500 ETF;FR0011550185;12;26.65
              Sample Broker;CTO;Sample Bank;Sample Bank Share;GLE.PA;10;
      responses:
        '200':
          description: What the import created and updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportReportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Nothing was written; every refused row is listed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ImportRejectionResponse'
  /portfolio/performance:
    get:
      tags: [Performance]
      operationId: getPortfolioPerformance
      summary: Get the portfolio's current value and its change over a range, in total and per envelope
      description: >-
        Change is measured day over day for the shorter ranges, and reconstructed at constant
        composition for `5y` and `max` (see `PerformanceResponse.reconstructed`).
      parameters:
        - name: range
          in: query
          required: true
          description: >-
            The window the change is computed over. `5y` and `max` are reconstructed at constant
            composition rather than measured day over day (see `reconstructed`).
          schema:
            type: string
            enum: [1d, 7d, 1m, 1y, 5y, max]
          example: 1m
      responses:
        '200':
          description: The portfolio's value and change, in total and per envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceResponse'
        '400':
          description: Unknown range
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: A holding is priced in a currency other than EUR
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /portfolio/import/template:
    get:
      tags: [Portfolio]
      operationId: getImportTemplate
      summary: Download the CSV template the import expects
      description: >-
        The header row plus two commented, non-imported example rows, ready to fill in.
      responses:
        '200':
          description: The header row and two commented example rows, which an import skips
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="cairn-import-template.csv"
          content:
            text/csv:
              schema:
                type: string
              example: |
                account;accountType;institution;instrument;isinOrTicker;quantity;averageCost
                # Sample Broker;PEA;Sample Bank;Sample S&P 500 ETF;FR0011550185;12;26.65
                # Sample Broker;CTO;Sample Bank;Sample Bank Share;GLE.PA;10;
        '401':
          $ref: '#/components/responses/Unauthorized'
  /holdings:
    get:
      tags: [Holding]
      operationId: listHoldings
      summary: List every holding
      description: >-
        Every holding, valued. A holding whose account, instrument or quote cannot be joined is
        left out rather than returned incomplete.
      responses:
        '200':
          description: Every holding
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HoldingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Holding]
      operationId: createHolding
      summary: Create a holding
      description: An account can only hold one position per instrument; use the update endpoint to change its quantity.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHoldingRequest'
            example:
              accountId: 8f14e45f-ceea-467e-adc4-0a2c1fe23c5f
              instrumentId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              quantity: 12
              averageCost: 26.65
      responses:
        '201':
          description: Holding created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Unknown account or instrument
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: The account already holds this instrument, or the quantity is zero
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /holdings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The holding's id.
        schema:
          type: string
          format: uuid
    patch:
      tags: [Holding]
      operationId: updateHolding
      summary: Update a holding
      description: Replaces the holding's quantity and cost basis. The account and instrument cannot be changed.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHoldingRequest'
            example:
              quantity: 31
              averageCost: 27.10
      responses:
        '200':
          description: Holding updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Unknown holding
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: The quantity is zero
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      tags: [Holding]
      operationId: deleteHolding
      summary: Delete a holding
      description: Removes the position without touching the account or the instrument it refers to.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204':
          description: Holding deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Unknown holding
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /accounts:
    get:
      tags: [Account]
      operationId: listAccounts
      summary: List every account
      description: Every account the owner has created, in no particular order.
      responses:
        '200':
          description: Every account
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Account]
      operationId: createAccount
      summary: Create an account
      description: The name must be unique across every account.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
            example:
              name: Sample Broker PEA
              type: PEA
              institution: Sample Bank
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: An account with this name already exists (account names are unique)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /accounts/{id}/cash:
    parameters:
      - name: id
        in: path
        required: true
        description: The account's id.
        schema:
          type: string
          format: uuid
    put:
      tags: [Account]
      operationId: setCashBalance
      summary: Set an account's cash balance in one call
      description: >-
        Creates, updates or removes the account's single EUR cash holding so its balance matches
        the given amount: a positive amount upserts the cash holding, and a zero amount deletes it
        if one exists. There is at most one EUR cash holding per account.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCashBalanceRequest'
            example:
              amount: 1500.00
      responses:
        '204':
          description: Cash balance set
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Unknown account
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: A negative amount
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /instruments:
    get:
      tags: [Instrument]
      operationId: listInstruments
      summary: List every instrument
      description: Every instrument known to Cairn, whether or not any account currently holds it.
      responses:
        '200':
          description: Every instrument
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstrumentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Instrument]
      operationId: createInstrument
      summary: Create an instrument
      description: The ISIN and source reference, when given, must each be unique across every instrument.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstrumentRequest'
            example:
              name: Sample S&P 500 ETF
              isin: FR0011550185
              currency: EUR
              assetClass: ETF
              priceSource: YAHOO
              sourceRef: SXR8.DE
      responses:
        '201':
          description: Instrument created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Another instrument already uses this ISIN or source reference
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: >-
            Invalid instrument: `sourceRef` is required unless `priceSource` is `MANUAL`, or
            `description` is over 280 characters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /instruments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The instrument's id.
        schema:
          type: string
          format: uuid
    get:
      tags: [Instrument]
      operationId: getInstrument
      summary: Get an instrument's detail
      description: The full record, including the fields not shown in the list view, plus the number of holdings that would be deleted along with it.
      responses:
        '200':
          description: Instrument detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown instrument
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    put:
      tags: [Instrument]
      operationId: updateInstrument
      summary: Replace an instrument's editable fields
      description: The currency is not editable; it is kept from the existing instrument.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInstrumentRequest'
            example:
              name: Sample S&P 500 ETF
              assetClass: ETF
              priceSource: YAHOO
              isin: FR0011550185
              sourceRef: SXR8.DE
      responses:
        '200':
          description: Instrument updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Unknown instrument
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Another instrument already uses this ISIN or source reference
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: >-
            Invalid instrument: `sourceRef` is required unless `priceSource` is `MANUAL`, or
            `description` is over 280 characters. Attempting to change the currency is silently
            ignored rather than rejected.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      tags: [Instrument]
      operationId: deleteInstrument
      summary: Delete an instrument and its holdings
      description: Deletes the instrument and every holding of it, in one transaction.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204':
          description: Instrument deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Unknown instrument
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /instruments/resolve:
    post:
      tags: [Instrument]
      operationId: resolveInstrument
      summary: Resolve a query into candidate price sources
      description: >-
        Probes every price source that could know the query for a live price. A source that is
        down is skipped rather than failing the whole call.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: An ISIN, a ticker or a name
                  example: FR0011550185
      responses:
        '200':
          description: Candidate price sources, each probed for a live price
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstrumentCandidateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: No source knows this instrument
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /instruments/{id}/quotes:
    parameters:
      - name: id
        in: path
        required: true
        description: The instrument's id.
        schema:
          type: string
          format: uuid
    get:
      tags: [Quote]
      operationId: listQuotes
      summary: List an instrument's quote history over a date range
      description: An unknown instrument yields an empty list, not a 404.
      parameters:
        - name: from
          in: query
          required: true
          description: Start of the range, inclusive.
          schema:
            type: string
            format: date
          example: 2026-01-01
        - name: to
          in: query
          required: true
          description: End of the range, inclusive.
          schema:
            type: string
            format: date
          example: 2026-09-25
      responses:
        '200':
          description: The quote history over the requested range
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Quote]
      operationId: recordQuote
      summary: Record a manual quote for an instrument
      description: Records a MANUAL quote, replacing any quote already recorded for that instrument on that date.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordQuoteRequest'
            example:
              asOf: 2026-09-25
              price: 28.10
      responses:
        '201':
          description: Quote recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Unknown instrument
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /quotes/refresh:
    post:
      tags: [Quote]
      operationId: refreshQuotes
      summary: Refresh every refreshable instrument's quote synchronously
      description: >-
        Fetches a fresh quote for every non-manual instrument. A per-instrument failure (an
        upstream source down, or a query it no longer resolves) is reported in `failures`; it
        never fails the call as a whole.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '200':
          description: The outcome of the refresh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshReportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /jobs/runs:
    get:
      tags: [Jobs]
      operationId: getJobRuns
      summary: List recent batch job runs, most recent first
      description: Reads Spring Batch's own execution metadata; there is no Cairn-specific job history.
      parameters:
        - name: limit
          in: query
          required: false
          description: The maximum number of runs to return.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Recent batch job executions, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobRunResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /history:
    get:
      tags: [History]
      operationId: getHistory
      summary: Get the portfolio value over time
      description: >-
        In `snapshot` mode, returns the measured value recorded by the nightly snapshot job for
        each day in range. In `constant-mix` mode, reprices today's holdings over past quotes, so
        the composition is held constant while the market moves; this is how `5y` and `max`
        performance is reconstructed.
      parameters:
        - name: mode
          in: query
          required: true
          description: >-
            `snapshot` returns the measured nightly value; `constant-mix` reprices today's holdings
            over the requested range.
          schema:
            type: string
            enum: [snapshot, constant-mix]
          example: snapshot
        - name: from
          in: query
          required: true
          description: Start of the range, inclusive.
          schema:
            type: string
            format: date
          example: 2026-01-01
        - name: to
          in: query
          required: true
          description: End of the range, inclusive. Must not be before `from`.
          schema:
            type: string
            format: date
          example: 2026-09-25
      responses:
        '200':
          description: The portfolio value over time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
        '400':
          description: Unknown mode, or `to` is before `from`
        '401':
          $ref: '#/components/responses/Unauthorized'
  /history/intraday:
    get:
      tags: [History]
      operationId: getIntradayHistory
      summary: Get the requested day's valuation points
      description: >-
        The worker's 15-minute valuations of that Europe/Paris day, as recorded by its intraday
        refresh scheduler.
      parameters:
        - name: date
          in: query
          required: true
          description: The Europe/Paris day to return valuation points for.
          schema:
            type: string
            format: date
          example: 2026-09-25
      responses:
        '200':
          description: The requested day's valuation points
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntradayHistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /session:
    get:
      tags: [Session]
      operationId: getSession
      summary: Get the signed-in owner and their registered passkeys
      description: Fails with 401 rather than an empty body when no session is open, since Cairn has a single owner.
      responses:
        '200':
          description: The signed-in owner and the passkeys registered for them
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /session/passkeys/{credentialId}:
    delete:
      tags: [Session]
      operationId: revokePasskey
      summary: Revoke a passkey
      description: >-
        Also signs out every other session of the owner, since a revoked passkey may have been the
        one used to open them.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: credentialId
          in: path
          required: true
          description: Base64url credential id, as returned by `GET /session`.
          schema:
            type: string
      responses:
        '204':
          description: The passkey no longer opens this account
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such passkey for this owner
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: This is the last passkey; revoking it would lock the owner out
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: >-
        Session opened by a passkey (WebAuthn) sign-in, lasting 30 days, sliding. The ceremony
        itself is served by Spring Security, not by this contract: `POST /webauthn/register/options`
        then `POST /webauthn/register` for registration, `POST /webauthn/authenticate/options`
        then `POST /login/webauthn` for sign-in, and `POST /logout` to end the session.
    csrfToken:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: >-
        Required on every POST, PUT, PATCH and DELETE. The value is the raw token from the
        `XSRF-TOKEN` cookie the server sets; a write submitted without it is refused with 403.
  responses:
    Unauthorized:
      description: No valid session
    Forbidden:
      description: Missing or wrong CSRF token on a write
    BadRequest:
      description: >-
        The body could not be read, a required field is missing, or a parameter has the wrong
        type. Rendered in Spring Boot's default error format, not as a problem detail.
    NotFound:
      description: The resource does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: The resource conflicts with one that already exists
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    BusinessRuleViolated:
      description: A business rule was violated
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    ProblemDetail:
      description: >-
        RFC 9457 problem detail, served as `application/problem+json` for every business, conflict
        and not-found error.
      type: object
      properties:
        type:
          type: string
          description: A URI reference identifying the problem type. `about:blank` when none is more specific.
          example: about:blank
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          example: Unprocessable Entity
        status:
          type: integer
          description: The HTTP status code, repeated from the response.
          example: 422
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          example: A holding is priced in a currency other than EUR.
        instance:
          type: string
          description: A URI reference identifying this specific occurrence of the problem.
          example: /portfolio
    AccountType:
      type: string
      description: >-
        The kind of envelope an account is. `PEA`/`PEA_PME` and `PER` are French tax-advantaged
        equity and retirement accounts, `CTO` is an ordinary brokerage account, `PEE` is an
        employee savings plan, `LIFE_INSURANCE` is a French assurance-vie, `SAVINGS` is a bank
        savings account, and `CRYPTO` is a crypto exchange or wallet.
      enum: [PEA, PEA_PME, CTO, PER, PEE, LIFE_INSURANCE, SAVINGS, CRYPTO]
    AssetClass:
      type: string
      description: >-
        The kind of instrument. `EQUITY` is a single stock, `ETF` an exchange-traded fund, `FUND`
        a non-traded fund, `CRYPTO` a cryptocurrency, and `CASH` a currency balance priced at par.
      enum: [EQUITY, ETF, FUND, CRYPTO, CASH]
    PriceSource:
      type: string
      description: >-
        Where an instrument's price comes from. `YAHOO` is Yahoo Finance, `COINGECKO` is CoinGecko,
        `SG_SIRIUS` is Societe Generale's structured-product pricing feed, and `MANUAL` means the
        price is entered by hand rather than fetched.
      enum: [YAHOO, COINGECKO, SG_SIRIUS, MANUAL]
    PerformanceRange:
      type: string
      description: >-
        The window a performance figure is computed over. `5y` and `max` are reconstructed at
        constant composition rather than measured day over day (see `reconstructed`).
      enum: [1d, 7d, 1m, 1y, 5y, max]
    PortfolioResponse:
      description: >-
        The whole portfolio, aggregated to one valued total plus a breakdown by asset class, by
        account and the full list of holdings. Returned by `GET /portfolio`.
      type: object
      required:
        [totalEur, dayChangeEur, staleCount, unvaluedCount, generatedAt, byAssetClass, byAccount, holdings]
      properties:
        totalEur:
          type: number
          description: The portfolio's total value, across every valued holding.
          example: 184320.75
        dayChangeEur:
          type: number
          description: The portfolio's value change since the previous close.
          example: 1250.30
        dayChangeRatio:
          type: number
          nullable: true
          description: Absent when the previous total is zero.
          example: 0.0068
        unrealizedGainEur:
          type: number
          nullable: true
          description: Absent when no holding's cost basis is known enough to sum. Never 0.
          example: 12500.00
        unrealizedGainRatio:
          type: number
          nullable: true
          description: Absent when the cost basis total is zero.
          example: 0.0725
        staleCount:
          type: integer
          description: The number of holdings whose latest quote is older than expected for their asset class.
          example: 1
        unvaluedCount:
          type: integer
          description: >-
            The number of holdings with no quote yet. Excluded from totalEur, the allocations and
            the unrealized gain until a quote is fetched.
          example: 0
        generatedAt:
          type: string
          format: date-time
          description: When this response was computed.
          example: 2026-09-25T18:00:00Z
        byAssetClass:
          type: array
          description: Sorted by valueEur, descending.
          items:
            $ref: '#/components/schemas/AllocationResponse'
        byAccount:
          type: array
          description: Sorted by valueEur, descending.
          items:
            $ref: '#/components/schemas/AllocationResponse'
        holdings:
          type: array
          description: Every valued holding making up the portfolio.
          items:
            $ref: '#/components/schemas/HoldingResponse'
    PerformanceResponse:
      description: >-
        The portfolio's value and its change over a requested range, in total and broken down by
        envelope (account type). Returned by `GET /portfolio/performance`.
      type: object
      required: [range, from, to, reconstructed, total, byEnvelope]
      properties:
        range:
          description: The window this performance was computed over, echoed back from the request.
          allOf:
            - $ref: '#/components/schemas/PerformanceRange'
        from:
          type: string
          format: date
          description: Start of the range, inclusive.
          example: 2026-08-25
        to:
          type: string
          format: date
          description: End of the range, inclusive.
          example: 2026-09-25
        reconstructed:
          type: boolean
          description: >
            True when the change is rebuilt at constant composition (5y and max) rather than
            measured day over day.
          example: false
        lastPriceAt:
          type: string
          format: date-time
          nullable: true
          description: >
            The most recent fetchedAt among the quotes of the valued lines, excluding manual cash
            at par. Absent when nothing is quoted yet.
          example: 2026-09-25T16:30:00Z
        total:
          description: The portfolio's value and change over the range, across every envelope.
          allOf:
            - $ref: '#/components/schemas/PerformanceTotalResponse'
        byEnvelope:
          type: array
          description: Sorted by valueEur, descending.
          items:
            $ref: '#/components/schemas/EnvelopePerformanceResponse'
    PerformanceTotalResponse:
      description: The portfolio's total value and its change over a performance range.
      type: object
      required: [valueEur, changeEur]
      properties:
        valueEur:
          type: number
          description: The portfolio's total value at the end of the range.
          example: 184320.75
        changeEur:
          type: number
          description: The portfolio's value change over the range.
          example: 5230.10
        changeRatio:
          type: number
          nullable: true
          description: Absent when the base value is zero.
          example: 0.0292
    EnvelopePerformanceResponse:
      description: >-
        One account type's (envelope's) value and change over a performance range, one entry of
        `PerformanceResponse.byEnvelope`.
      type: object
      required: [accountType, valueEur, share, changeEur]
      properties:
        accountType:
          description: The account type this entry aggregates every account of.
          allOf:
            - $ref: '#/components/schemas/AccountType'
        valueEur:
          type: number
          description: The total value of every account of this type, at the end of the range.
          example: 92000.00
        share:
          type: number
          description: This envelope's fraction of the portfolio's total value.
          example: 0.4991
        changeEur:
          type: number
          description: This envelope's value change over the range.
          example: 2100.00
        changeRatio:
          type: number
          nullable: true
          description: Absent when the base value is zero.
          example: 0.0233
    ImportRejectionResponse:
      description: >-
        RFC 9457 problem detail for a refused import. Nothing was written: every row that could
        not be accepted is listed, so the whole file can be fixed in one pass.
      type: object
      required: [status, detail, errors]
      properties:
        type:
          type: string
          description: A URI reference identifying the problem type. `about:blank` when none is more specific.
          example: about:blank
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          example: Unprocessable Entity
        status:
          type: integer
          description: The HTTP status code, repeated from the response.
          example: 422
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          example: The file was rejected; see errors for every offending row.
        errors:
          type: array
          description: Every refused row, so the whole file can be fixed in one pass.
          items:
            $ref: '#/components/schemas/ImportErrorResponse'
    ImportErrorResponse:
      description: >-
        One refused row. The server states what went wrong as a code, never as a sentence, so the
        wording belongs to whoever displays it and can be translated.
      type: object
      required: [line, code]
      properties:
        line:
          type: integer
          description: 1-based line in the submitted file; 1 when the header itself is wrong
          example: 3
        code:
          type: string
          description: What went wrong on this line, as a stable code the client translates itself.
          example: UNRESOLVED_INSTRUMENT
          enum:
            - BAD_HEADER
            - WRONG_COLUMN_COUNT
            - UNKNOWN_ACCOUNT_TYPE
            - NOT_A_NUMBER
            - ZERO_QUANTITY
            - UNRESOLVED_INSTRUMENT
        value:
          type: string
          description: The offending token, absent when the failure has none
          example: FR0000000000
    ImportReportResponse:
      description: >-
        What a successful `POST /portfolio/import` created or updated, one counter per kind of
        write.
      type: object
      required: [accountsCreated, instrumentsCreated, holdingsCreated, holdingsUpdated]
      properties:
        accountsCreated:
          type: integer
          description: The number of accounts the import created because no matching name existed yet.
          example: 1
        instrumentsCreated:
          type: integer
          description: The number of instruments the import created because none matched by ISIN or source reference.
          example: 2
        holdingsCreated:
          type: integer
          description: The number of holdings the import created because the account did not already hold that instrument.
          example: 2
        holdingsUpdated:
          type: integer
          description: The number of existing holdings whose quantity and cost basis the import replaced.
          example: 0
    AllocationResponse:
      description: >-
        One slice of a portfolio breakdown, by asset class or by account, one entry of
        `PortfolioResponse.byAssetClass` or `PortfolioResponse.byAccount`.
      type: object
      required: [label, valueEur, share]
      properties:
        label:
          type: string
          description: The asset class or account name this allocation groups holdings under.
          example: ETF
        valueEur:
          type: number
          description: The total value of every holding in this slice.
          example: 92000.00
        share:
          type: number
          description: This allocation's fraction of the portfolio's total value.
          example: 0.4991
    CreateHoldingRequest:
      description: The body of `POST /holdings`, a new position of an instrument in an account.
      type: object
      required: [accountId, instrumentId, quantity]
      properties:
        accountId:
          type: string
          format: uuid
          description: The account the holding is created in.
          example: 8f14e45f-ceea-467e-adc4-0a2c1fe23c5f
        instrumentId:
          type: string
          format: uuid
          description: The instrument the holding is a position of.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        quantity:
          type: number
          description: Must not be zero.
          example: 12
        averageCost:
          type: number
          nullable: true
          description: The per-unit cost basis. Omit when unknown.
          example: 26.65
    UpdateHoldingRequest:
      description: The body of `PATCH /holdings/{id}`, replacing a holding's quantity and cost basis.
      type: object
      required: [quantity]
      properties:
        quantity:
          type: number
          description: Must not be zero.
          example: 31
        averageCost:
          type: number
          nullable: true
          description: The per-unit cost basis. Omit when unknown.
          example: 27.10
    HoldingResponse:
      description: >-
        A single position, valued: an instrument held in an account, with its current price,
        market value and gain when they can be computed. Appears in `PortfolioResponse.holdings`
        and is returned directly by `GET /holdings` and the holding write endpoints.
      type: object
      required:
        - id
        - accountId
        - accountName
        - accountType
        - instrumentId
        - instrumentName
        - assetClass
        - quantity
        - priceSource
        - stale
      properties:
        id:
          type: string
          format: uuid
          description: The holding's own id.
          example: 5b1f1a2e-8c3d-4e6a-9f0b-1234567890ab
        accountId:
          type: string
          format: uuid
          description: The account this holding belongs to.
          example: 8f14e45f-ceea-467e-adc4-0a2c1fe23c5f
        accountName:
          type: string
          description: The account's name, as of when this response was computed.
          example: Sample Broker PEA
        accountType:
          description: The account's type.
          allOf:
            - $ref: '#/components/schemas/AccountType'
        instrumentId:
          type: string
          format: uuid
          description: The instrument this holding is a position of.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        instrumentName:
          type: string
          description: The instrument's name, as of when this response was computed.
          example: Sample S&P 500 ETF
        isin:
          type: string
          nullable: true
          description: The instrument's ISIN. Absent when the instrument has none.
          example: FR0011550185
        assetClass:
          description: The instrument's asset class.
          allOf:
            - $ref: '#/components/schemas/AssetClass'
        quantity:
          type: number
          description: The number of units held, never zero.
          example: 12
        averageCost:
          type: number
          nullable: true
          description: Absent when the cost basis is unknown. Never 0.
          example: 26.65
        price:
          type: number
          nullable: true
          description: Absent when the instrument has no quote yet. Never 0.
          example: 28.10
        priceCurrency:
          type: string
          nullable: true
          description: The currency the price is expressed in, as an ISO 4217 code. Absent along with price.
          example: EUR
        priceAsOf:
          type: string
          format: date
          nullable: true
          description: The date the latest quote was observed on. Absent along with price.
          example: 2026-09-25
        priceSource:
          description: Where the instrument's price comes from.
          allOf:
            - $ref: '#/components/schemas/PriceSource'
        stale:
          type: boolean
          description: >-
            True when the latest quote is older than its asset class allows: an equity or ETF quote dated
            before the previous business day, a crypto quote fetched more than 6 hours ago, a fund quote
            fetched more than 4 days ago or dated more than 10 days ago. Never true for cash or an
            instrument with no quote yet.
          example: false
        marketValueEur:
          type: number
          nullable: true
          description: Absent when the instrument has no quote yet. Never 0.
          example: 337.20
        unrealizedGainEur:
          type: number
          nullable: true
          description: Market value minus cost basis. Absent when either is unknown.
          example: 17.40
        unrealizedGainRatio:
          type: number
          nullable: true
          description: Unrealized gain as a fraction of the cost basis. Absent when the cost basis is zero or unknown.
          example: 0.0653
        dayChangeEur:
          type: number
          nullable: true
          description: Value change since the previous close. Absent when there is no previous quote to compare with.
          example: 4.20
        dayChangeRatio:
          type: number
          nullable: true
          description: Day change as a fraction of the previous close's value. Absent when the previous value is zero.
          example: 0.0125
    AccountResponse:
      description: An account (envelope) holdings live in, as returned by the account endpoints.
      type: object
      required: [id, name, type, institution]
      properties:
        id:
          type: string
          format: uuid
          description: The account's id.
          example: 8f14e45f-ceea-467e-adc4-0a2c1fe23c5f
        name:
          type: string
          description: Unique across every account.
          example: Sample Broker PEA
        type:
          description: The kind of envelope this account is.
          allOf:
            - $ref: '#/components/schemas/AccountType'
        institution:
          type: string
          description: The bank or broker the account is held at.
          example: Sample Bank
    CreateAccountRequest:
      description: The body of `POST /accounts`.
      type: object
      required: [name, type, institution]
      properties:
        name:
          type: string
          description: Must be unique across every account.
          example: Sample Broker PEA
        type:
          description: The kind of envelope this account is.
          allOf:
            - $ref: '#/components/schemas/AccountType'
        institution:
          type: string
          description: The bank or broker the account is held at.
          example: Sample Bank
    SetCashBalanceRequest:
      description: The body of `PUT /accounts/{id}/cash`.
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          description: The desired EUR cash balance. Must not be negative; zero removes the cash holding.
          example: 1500.00
    InstrumentResponse:
      description: >-
        A tradable or holdable instrument as it appears in a list, priced from a market data
        source or entered manually. Returned by `GET /instruments` and the instrument write
        endpoints.
      type: object
      required: [id, name, currency, assetClass, priceSource]
      properties:
        id:
          type: string
          format: uuid
          description: The instrument's id.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        name:
          type: string
          description: The instrument's display name.
          example: Sample S&P 500 ETF
        isin:
          type: string
          nullable: true
          description: The instrument's ISIN. Absent when the instrument has none.
          example: FR0011550185
        currency:
          type: string
          description: The instrument's native pricing currency, as an ISO 4217 code.
          example: EUR
        assetClass:
          description: The kind of instrument.
          allOf:
            - $ref: '#/components/schemas/AssetClass'
        priceSource:
          description: Where the instrument's price comes from.
          allOf:
            - $ref: '#/components/schemas/PriceSource'
        sourceRef:
          type: string
          nullable: true
          description: The ticker, contract identifier or ISIN the price source is queried with. Absent for MANUAL.
          example: SXR8.DE
    InstrumentDetailResponse:
      description: >-
        The full detail of one instrument, including fields not shown in the list view and the
        number of holdings that would be deleted with it. Returned by `GET /instruments/{id}` and
        the instrument write endpoints.
      type: object
      required: [id, name, currency, assetClass, priceSource, holdingCount]
      properties:
        id:
          type: string
          format: uuid
          description: The instrument's id.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        name:
          type: string
          description: The instrument's display name.
          example: Sample S&P 500 ETF
        isin:
          type: string
          nullable: true
          description: The instrument's ISIN. Absent when the instrument has none.
          example: FR0011550185
        currency:
          type: string
          description: The instrument's native pricing currency, as an ISO 4217 code. Not editable.
          example: EUR
        assetClass:
          description: The kind of instrument.
          allOf:
            - $ref: '#/components/schemas/AssetClass'
        priceSource:
          description: Where the instrument's price comes from.
          allOf:
            - $ref: '#/components/schemas/PriceSource'
        sourceRef:
          type: string
          nullable: true
          description: The ticker, contract identifier or ISIN the price source is queried with. Absent for MANUAL.
          example: SXR8.DE
        description:
          type: string
          nullable: true
          description: Free text, up to 280 characters.
          example: Core equity ETF tracking the S&P 500.
        externalUrl:
          type: string
          nullable: true
          description: Absent for a manually priced instrument. Never a broken link.
          example: https://finance.yahoo.com/quote/SXR8.DE
        holdingCount:
          type: integer
          description: The number of holdings that will be deleted with the instrument.
          example: 2
    CreateInstrumentRequest:
      description: The body of `POST /instruments`.
      type: object
      required: [name, currency, assetClass, priceSource]
      properties:
        name:
          type: string
          description: The instrument's display name.
          example: Sample S&P 500 ETF
        isin:
          type: string
          nullable: true
          description: The instrument's ISIN. Must be unique across every instrument when given.
          example: FR0011550185
        currency:
          type: string
          description: The instrument's native pricing currency, as an ISO 4217 code.
          example: EUR
        assetClass:
          description: The kind of instrument.
          allOf:
            - $ref: '#/components/schemas/AssetClass'
        priceSource:
          description: Where the instrument's price comes from.
          allOf:
            - $ref: '#/components/schemas/PriceSource'
        sourceRef:
          type: string
          nullable: true
          description: Required unless priceSource is MANUAL.
          example: SXR8.DE
        description:
          type: string
          nullable: true
          description: Free text, up to 280 characters.
          example: Core equity ETF tracking the S&P 500.
    UpdateInstrumentRequest:
      description: The body of `PUT /instruments/{id}`. The currency cannot be changed this way.
      type: object
      required: [name, assetClass, priceSource]
      properties:
        name:
          type: string
          description: The instrument's display name.
          example: Sample S&P 500 ETF
        assetClass:
          description: The kind of instrument.
          allOf:
            - $ref: '#/components/schemas/AssetClass'
        priceSource:
          description: Where the instrument's price comes from.
          allOf:
            - $ref: '#/components/schemas/PriceSource'
        isin:
          type: string
          nullable: true
          description: The instrument's ISIN. Must be unique across every instrument when given.
          example: FR0011550185
        sourceRef:
          type: string
          nullable: true
          description: Required unless priceSource is MANUAL.
          example: SXR8.DE
        description:
          type: string
          nullable: true
          description: Free text, up to 280 characters.
          example: Core equity ETF tracking the S&P 500.
    InstrumentCandidateResponse:
      description: >-
        One price source's answer while resolving a query, with a live price fetched as a sanity
        check. Returned by `POST /instruments/resolve`.
      type: object
      required: [name, source, sourceRef, assetClass, probePrice]
      properties:
        name:
          type: string
          description: The instrument's name as reported by this source.
          example: iShares Core S&P 500 UCITS ETF
        source:
          description: The price source this candidate was resolved from.
          allOf:
            - $ref: '#/components/schemas/PriceSource'
        sourceRef:
          type: string
          description: The ticker, contract identifier or ISIN this candidate would be resolved with.
          example: SXR8.DE
        assetClass:
          description: The kind of instrument this source reports it as.
          allOf:
            - $ref: '#/components/schemas/AssetClass'
        probePrice:
          type: number
          description: The live price fetched from this source while resolving, as a sanity check.
          example: 28.10
    QuoteResponse:
      description: >-
        One recorded price point for an instrument. Returned by `GET /instruments/{id}/quotes` and
        `POST /instruments/{id}/quotes`.
      type: object
      required: [instrumentId, asOf, price, currency, source]
      properties:
        instrumentId:
          type: string
          format: uuid
          description: The instrument this quote prices.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        asOf:
          type: string
          format: date
          description: The date this price was observed on.
          example: 2026-09-25
        price:
          type: number
          description: The price, in the instrument's native currency.
          example: 28.10
        currency:
          type: string
          description: The currency the price is expressed in, as an ISO 4217 code.
          example: EUR
        source:
          description: Where this quote came from.
          allOf:
            - $ref: '#/components/schemas/PriceSource'
    RecordQuoteRequest:
      description: The body of `POST /instruments/{id}/quotes`, a manually entered price point.
      type: object
      required: [asOf, price]
      properties:
        asOf:
          type: string
          format: date
          description: The date this price was observed on. Replaces any quote already recorded for that date.
          example: 2026-09-25
        price:
          type: number
          description: The price, in the instrument's native currency.
          example: 28.10
    RefreshReportResponse:
      description: >-
        The outcome of a synchronous refresh of every refreshable instrument. Returned by
        `POST /quotes/refresh`.
      type: object
      required: [refreshed, skipped, failures]
      properties:
        refreshed:
          type: integer
          description: The number of instruments successfully repriced.
          example: 14
        skipped:
          type: integer
          description: The number of MANUAL instruments, not attempted.
          example: 2
        failures:
          type: array
          description: One entry per instrument whose price source could not be reached or resolved.
          items:
            $ref: '#/components/schemas/RefreshFailureResponse'
    RefreshFailureResponse:
      description: One instrument a refresh could not reprice, one entry of `RefreshReportResponse.failures`.
      type: object
      required: [instrumentId, instrumentName, source, message]
      properties:
        instrumentId:
          type: string
          format: uuid
          description: The instrument that could not be repriced.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        instrumentName:
          type: string
          description: The instrument's name, for display without a further lookup.
          example: Sample Bank Share
        source:
          description: The price source that failed to answer.
          allOf:
            - $ref: '#/components/schemas/PriceSource'
        message:
          type: string
          description: A short, technical explanation of why this instrument could not be refreshed.
          example: Yahoo Finance returned no quote for ticker GLE.PA
    JobRunResponse:
      description: One recorded execution of a Spring Batch job. Returned by `GET /jobs/runs`.
      type: object
      required: [id, jobName, status, startedAt]
      properties:
        id:
          type: integer
          format: int64
          description: Spring Batch's own execution id.
          example: 42
        jobName:
          type: string
          description: The Spring Batch job's registered name.
          example: refreshQuotesJob
        status:
          type: string
          description: >-
            The Spring Batch execution status. `STARTED`/`STARTING`/`STOPPING` are in progress,
            `COMPLETED` is a success, `FAILED` and `ABANDONED` mark a run that did not complete,
            `STOPPED` was stopped on request, and `UNKNOWN` is a status Spring Batch could not
            determine.
          example: COMPLETED
          enum: [STARTING, STARTED, STOPPING, STOPPED, FAILED, COMPLETED, ABANDONED, UNKNOWN]
        startedAt:
          type: string
          format: date-time
          description: When this run started.
          example: 2026-09-25T05:00:00Z
        endedAt:
          type: string
          format: date-time
          nullable: true
          description: Absent while the run is still in progress.
          example: 2026-09-25T05:02:14Z
    HistoryResponse:
      description: >-
        The portfolio's value over a date range, either measured or reconstructed. Returned by
        `GET /history`.
      type: object
      required: [mode, reconstructed, points]
      properties:
        mode:
          type: string
          description: >-
            `snapshot` returns the measured nightly value for each day; `constant-mix` reprices
            today's holdings over past quotes, holding the composition constant.
          example: snapshot
          enum: [snapshot, constant-mix]
        reconstructed:
          type: boolean
          description: >
            True when the series is rebuilt at today's composition rather than measured.
            The client warns the user when the requested range makes this material.
          example: false
        points:
          type: array
          description: One point per day in the requested range.
          items:
            $ref: '#/components/schemas/HistoryPoint'
    HistoryPoint:
      description: The portfolio's total value on one day, one entry of `HistoryResponse.points`.
      type: object
      required: [date, totalEur]
      properties:
        date:
          type: string
          format: date
          description: The day this value applies to.
          example: 2026-09-20
        totalEur:
          type: number
          description: The portfolio's total value on that day.
          example: 181500.00
    IntradayHistoryResponse:
      description: A day's intraday valuation points. Returned by `GET /history/intraday`.
      type: object
      required: [points]
      properties:
        points:
          type: array
          description: One point per intraday refresh recorded that day, in chronological order.
          items:
            $ref: '#/components/schemas/IntradayHistoryPoint'
    IntradayHistoryPoint:
      description: One intraday valuation, one entry of `IntradayHistoryResponse.points`.
      type: object
      required: [at, totalEur]
      properties:
        at:
          type: string
          format: date-time
          description: The instant this valuation was recorded, one of the worker's 15-minute refreshes.
          example: 2026-09-25T13:15:00Z
        totalEur:
          type: number
          description: The portfolio's total value at that instant.
          example: 183900.50
    SessionResponse:
      description: The signed-in owner's display name and registered passkeys. Returned by `GET /session`.
      type: object
      required: [displayName, initials, passkeys]
      properties:
        displayName:
          type: string
          description: The owner's display name, as entered when the first passkey was registered.
          example: Joan Roucoux
        initials:
          type: string
          maxLength: 2
          description: Up to two letters derived from displayName, for a compact avatar.
          example: JR
        passkeys:
          type: array
          description: Every passkey currently registered for the owner.
          items:
            $ref: '#/components/schemas/PasskeyResponse'
    PasskeyResponse:
      description: One registered passkey, one entry of `SessionResponse.passkeys`.
      type: object
      required: [credentialId, label, createdAt]
      properties:
        credentialId:
          type: string
          description: Base64url, as stored by Spring Security
          example: AbCdEf1234567890
        label:
          type: string
          description: The name the owner gave this passkey when registering it.
          example: iPhone de Joan
        createdAt:
          type: string
          format: date-time
          description: When this passkey was registered.
          example: 2026-01-15T09:30:00Z
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: When this passkey last opened a session. Absent when it has never been used to sign in.
          example: 2026-09-25T07:45:00Z
