server:
  servlet:
    session:
      cookie:
        secure: true
        same-site: strict
        max-age: 30d

spring:
  application:
    name: cairn-api
  docker:
    compose:
      file: ../compose.local.yaml
      lifecycle-management: start-only
      start:
        skip: never
  session:
    timeout: 30d
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 0 * * * *"
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 250
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        linger.ms: 0
  datasource:
    url: jdbc:postgresql://localhost:5432/app
    username: app
    password: ${SPRING_DATASOURCE_PASSWORD:app}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    contexts: '!demo'
  jackson:
    default-property-inclusion: non_null

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  zone: Europe/Paris
  webauthn:
    rp-id: ${CAIRN_RP_ID:localhost}
    allowed-origins: ${CAIRN_ORIGIN:http://localhost:4200}
  security:
    username: ${CAIRN_USERNAME:joan}
    password: ${CAIRN_PASSWORD:changeme}
  client:
    yahoo:
      base-url: https://query1.finance.yahoo.com
      connect-timeout: 3s
      read-timeout: 10s
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
      pause-between-calls: 300ms
    coingecko:
      base-url: https://api.coingecko.com
      connect-timeout: 3s
      read-timeout: 10s
    sg-sirius:
      base-url: https://investmentsolutions.societegenerale.fr
      connect-timeout: 5s
      read-timeout: 30s
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
  telegram:
    base-url: https://api.telegram.org
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
    connect-timeout: 3s
    read-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info
