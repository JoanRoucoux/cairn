spring:
  application:
    name: cairn-api
  datasource:
    url: jdbc:postgresql://localhost:5432/app
    username: app
    password: app
  jpa:
    hibernate:
      # The schema belongs to the schema module and is applied out-of-band: this application
      # only ever checks that the mapping matches what is already there.
      ddl-auto: validate
    open-in-view: false
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/local

app:
  client:
    market-data:
      base-url: http://localhost:8082
      connect-timeout: 2s
      read-timeout: 5s
    yahoo:
      base-url: https://query1.finance.yahoo.com
      connect-timeout: 3s
      read-timeout: 10s
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
      pause-between-calls: 300ms
    coingecko:
      base-url: https://api.coingecko.com
      connect-timeout: 3s
      read-timeout: 10s
    sg-sirius:
      base-url: https://investmentsolutions.societegenerale.fr
      connect-timeout: 5s
      read-timeout: 30s
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"

management:
  endpoints:
    web:
      exposure:
        include: health,info
