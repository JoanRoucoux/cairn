spring:
  application:
    name: cairn-api
  session:
    # spring.session.timeout, not server.servlet.session.timeout: a @SpringBootTest's default MOCK
    # web environment carries a ServletContext without an embedded server behind it, which Spring
    # Boot's session auto-configuration treats as a WAR deployment, a branch that reads
    # spring.session.timeout directly and never falls back to server.servlet.session.timeout. The
    # cookie's own Secure/HttpOnly/SameSite/Max-Age attributes have the same problem and are set in
    # WebAuthnConfig#sessionCookieCustomizer instead, which both branches honor identically.
    timeout: 30d
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 0 * * * *"
  datasource:
    url: jdbc:postgresql://localhost:5432/app
    username: app
    password: ${SPRING_DATASOURCE_PASSWORD:app}
  jpa:
    hibernate:
      # The schema belongs to the schema module and is applied out-of-band: this application
      # only ever checks that the mapping matches what is already there.
      ddl-auto: validate
    open-in-view: false
  liquibase:
    # Only used by the *IT tests, which migrate a throwaway Testcontainers database with the real
    # changelog before ddl-auto: validate checks it. The demo changeset (012-seed-demo) is
    # opt-in via context="demo" and must stay excluded here.
    contexts: '!demo'
  jackson:
    default-property-inclusion: non_null

app:
  webauthn:
    rp-id: ${CAIRN_RP_ID:localhost}
    allowed-origins: ${CAIRN_ORIGIN:http://localhost:4200}
  security:
    username: ${CAIRN_USERNAME:joan}
    password: ${CAIRN_PASSWORD:changeme}
  client:
    yahoo:
      base-url: https://query1.finance.yahoo.com
      connect-timeout: 3s
      read-timeout: 10s
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
      pause-between-calls: 300ms
    coingecko:
      base-url: https://api.coingecko.com
      connect-timeout: 3s
      read-timeout: 10s
    sg-sirius:
      base-url: https://investmentsolutions.societegenerale.fr
      connect-timeout: 5s
      read-timeout: 30s
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"

management:
  endpoints:
    web:
      exposure:
        include: health,info
