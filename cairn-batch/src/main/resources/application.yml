spring:
  application:
    name: cairn-batch
  datasource:
    url: jdbc:postgresql://localhost:5432/app
    username: app
    password: app
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    # Only used by the *IT tests, which migrate a throwaway Testcontainers database with the real
    # changelog before ddl-auto: validate checks it. The seed changeset (011-seed-portfolio) is
    # opt-in via context="seed" and must stay excluded here.
    contexts: '!demo'
  batch:
    jdbc:
      # The batch metadata tables are owned by the schema module like every other table:
      # this application never creates them, whatever the environment.
      initialize-schema: never

app:
  client:
    yahoo:
      base-url: https://query1.finance.yahoo.com
      connect-timeout: 3s
      read-timeout: 10s
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
      pause-between-calls: 300ms
    coingecko:
      base-url: https://api.coingecko.com
      connect-timeout: 3s
      read-timeout: 10s
    sg-sirius:
      base-url: https://investmentsolutions.societegenerale.fr
      connect-timeout: 5s
      read-timeout: 30s
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
