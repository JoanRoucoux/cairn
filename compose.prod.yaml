# Production overlay: pulls prebuilt images from GHCR instead of building locally, and exposes
# nothing itself. TLS and ports 80/443 belong to the shared proxy (proxy/compose.yaml), a separate
# compose project reached over the external `edge` network, so redeploying Cairn never restarts
# the other applications on the host.
#
# Used as `docker compose -f compose.prod.yaml --profile migrate run --rm schema` then
# `docker compose -f compose.prod.yaml up -d api web`, never with compose.yaml at the same time
# (both declare the same service names against the same cairn-data volume).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - cairn-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 5s
      timeout: 3s
      retries: 10
    # Default network only, deliberately: never on `edge`, so no other application sharing the
    # proxy can reach the database at all.
    restart: unless-stopped

  # One-shot migration, run before api/web on every deploy: `--profile migrate run --rm schema`.
  schema:
    profiles: ['migrate']
    image: ghcr.io/joanroucoux/cairn-schema:${TAG:?TAG must be set}
    environment:
      LIQUIBASE_USERNAME: app
      LIQUIBASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ghcr.io/joanroucoux/cairn-api:${TAG:?TAG must be set}
    environment:
      - CAIRN_RP_ID=${CAIRN_DOMAIN:?CAIRN_DOMAIN must be set}
      - CAIRN_ORIGIN=https://${CAIRN_DOMAIN:?CAIRN_DOMAIN must be set}
      - CAIRN_PASSWORD=${CAIRN_PASSWORD:?CAIRN_PASSWORD must be set}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/app
      - SPRING_DATASOURCE_USERNAME=app
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    # No published port: reached only by the proxy, over `edge`, by service name.
    networks:
      - default
      - edge
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ghcr.io/joanroucoux/cairn-web:${TAG:?TAG must be set}
    # No published port either, for the same reason as api.
    networks:
      - default
      - edge
    restart: unless-stopped

  # Run by cron, never by `up`: `--profile batch run --rm batch`.
  batch:
    profiles: ['batch']
    image: ghcr.io/joanroucoux/cairn-batch:${TAG:?TAG must be set}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/app
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    depends_on:
      postgres:
        condition: service_healthy

networks:
  # Created once on the host with `docker network create edge`, and shared with the proxy.
  edge:
    external: true

volumes:
  cairn-data:
