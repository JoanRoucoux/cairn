services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - cairn-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  schema:
    profiles: ['migrate']
    image: ghcr.io/joanroucoux/cairn-schema:${TAG:?TAG must be set}
    environment:
      LIQUIBASE_USERNAME: app
      LIQUIBASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    depends_on:
      postgres:
        condition: service_healthy

  kafka:
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: lR5Qr19eTxSAMfX6HhybYg
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 768m
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null']
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s
      start_interval: 5s
    restart: unless-stopped

  worker:
    image: ghcr.io/joanroucoux/cairn-kafka:${TAG:?TAG must be set}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/app
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    mem_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: ghcr.io/joanroucoux/cairn-api:${TAG:?TAG must be set}
    environment:
      - CAIRN_RP_ID=${CAIRN_DOMAIN:?CAIRN_DOMAIN must be set}
      - CAIRN_ORIGIN=https://${CAIRN_DOMAIN:?CAIRN_DOMAIN must be set}
      - CAIRN_PASSWORD=${CAIRN_PASSWORD:?CAIRN_PASSWORD must be set}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/app
      - SPRING_DATASOURCE_USERNAME=app
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - default
      - edge
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ghcr.io/joanroucoux/cairn-web:${WEB_TAG:?WEB_TAG must be set}
    networks:
      - default
      - edge
    restart: unless-stopped

  batch:
    profiles: ['batch']
    image: ghcr.io/joanroucoux/cairn-batch:${TAG:?TAG must be set}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/app
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy

networks:
  edge:
    external: true

volumes:
  cairn-data:
  kafka-data:
